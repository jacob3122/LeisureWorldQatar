buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.1'
    }
}
allprojects {
    repositories {
        mavenCentral()
    }
}

apply plugin: "com.facebook.react.rootproject"

// Inject 16KB flexible page size support for all subprojects with CMake builds.
// Required for Google Play 16KB page size compliance (Android 15+).
// The RN Gradle Plugin only injects this flag for New Architecture apps,
// so we must do it globally for Old Architecture.
subprojects { subproject ->
    def applyPageSizeFlag = { proj ->
        def androidExt = proj.extensions.findByName('android')
        if (androidExt != null) {
            try {
                if (androidExt.externalNativeBuild.cmake.path != null) {
                    def cmakeArgs = androidExt.defaultConfig.externalNativeBuild.cmake.arguments
                    if (!cmakeArgs.any { arg -> arg.contains('ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES') }) {
                        cmakeArgs.add('-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON')
                    }
                }
            } catch (Exception ignored) {}
        }
    }
    if (subproject.state.executed) {
        applyPageSizeFlag(subproject)
    } else {
        subproject.afterEvaluate { applyPageSizeFlag(subproject) }
    }
}
